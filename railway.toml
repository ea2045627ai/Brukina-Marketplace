# BRUKINA ACCESS MARKETPLACE - RAILWAY CONFIG

[build]
  builder = "NIXPACKS"
  buildCommand = "npm ci && npm run check && npm run build"

[deploy]
  startCommand = "npm run start:railway"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"

[build.nixpacks]
  aptPkgs = []
