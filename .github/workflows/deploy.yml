name: Deploy Marketplace to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Execute Security and Accessibility Audits
        run: |
          node scripts/security-enforcer.mjs
          node scripts/accessibility-audit.mjs

      - name: Compile Production Assets
        run: npm run build

      - name: Upload Static Web Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to Live Free Domain Node
        id: deployment
        uses: actions/deploy-pages@v4
