name: Deploy Brukina Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required deployment settings
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for name in APP_ORIGIN NETLIFY_SITE_ID NETLIFY_AUTH_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing GitHub environment value: %s\n' "$name" >&2
              exit 1
            fi
          done
          node --input-type=module -e '
            const origin = new URL(process.env.APP_ORIGIN);
            if (origin.protocol !== "https:" || origin.origin !== process.env.APP_ORIGIN ||
                origin.pathname !== "/" || origin.search || origin.hash ||
                origin.username || origin.password) {
              console.error("APP_ORIGIN must be an HTTPS origin without a path or credentials.");
              process.exit(1);
            }
          '

      - name: Lint and build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run check
          npm run build
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/icon.svg
          test -s dist/icon-192.png
          test -s dist/icon-512.png

      - name: Publish to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --message="GitHub Actions production deploy"
