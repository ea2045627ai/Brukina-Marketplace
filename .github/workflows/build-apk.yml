name: Compile Brukina Android Production Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Java Development Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build unsigned Android package
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
          expect <<'EXPECT'
          set timeout -1
          spawn bubblewrap build --skipPwaValidation --skipSigning
          expect {
            -re {would you like to regenerate} { send "y\r"; exp_continue }
            -re {versionName for the new App version:} { send "1.0.0\r"; exp_continue }
            eof
          }
          EXPECT

      - name: Archive Production APK and AAB Packages
        uses: actions/upload-artifact@v4
        with:
          name: Brukina-Marketplace-Unsigned-Preview
          path: |
            *.apk
            *.aab
