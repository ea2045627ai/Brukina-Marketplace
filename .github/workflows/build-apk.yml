name: Compile Brukina Android Production Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Java Development Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Build unsigned Android package
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
          expect <<'EXPECT'
          set timeout 1200
          spawn bubblewrap build --skipPwaValidation --skipSigning
          expect {
            -re {(?i)would you like to regenerate your project\?} { send -- "y\r"; exp_continue }
            -re {versionName for the new App version:} { send -- "1.0.0\r"; exp_continue }
            timeout {
              puts stderr "Timed out waiting for Bubblewrap build prompts or completion."
              catch {close}
              catch {wait}
              exit 124
            }
            eof {}
          }
          set result [wait]
          exit [lindex $result 3]
          EXPECT

      - name: Verify unsigned Android packages
        run: |
          test -s app-release-unsigned-aligned.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Archive Unsigned Preview APK and AAB Packages
        uses: actions/upload-artifact@v4
        with:
          name: Brukina-Marketplace-Unsigned-Preview
          path: |
            app-release-unsigned-aligned.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
