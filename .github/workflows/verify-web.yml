name: Verify Web Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript and React
        run: npm run check

      - name: Build production web assets
        run: npm run build

      - name: Verify static distribution assets
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/icon.svg
          test -s dist/icon-192.png
          test -s dist/icon-512.png
