[functions.marketplace-checkout]
# The handler verifies checkout JWTs with auth.getUser and authenticates provider callbacks with HMAC.
verify_jwt = false

[functions.arkesel-payment-callback]
# Webhook requests authenticate with the raw-body HMAC signature in the handler.
verify_jwt = false

[functions.send-order-sms]
# The handler verifies the customer JWT and order ownership before sending.
verify_jwt = true
