# ==========================================================================
# BRUKINA ACCESS MARKETPLACE - MASTER NETLIFY CONFIGURATION
# Path: netlify.toml
# Coordinates production asset publication, chained build gates, and security parameters.
# ==========================================================================

[build]
  # FIXED: Points cleanly to the compiled distribution bundle generated by Vite
  publish = "dist"
  
  # FIXED: Chains your check validation suite directly into the active compilation loop
  command = "npm run check && npm run build"
  functions = "netlify/functions"

[[redirects]]
  # Essential single-page application fallback router parameters
  from = "/*"
  status = 200
  to = "/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
