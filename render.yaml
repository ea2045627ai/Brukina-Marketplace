# ==========================================================================
# BRUKINA ACCESS MARKETPLACE - MASTER RENDER ORCHESTRATION BLUEPRINT
# Path: render.yaml
# Configures the free-tier web container runner instance, Node environments, and build gates.
# ==========================================================================

services:
  - type: web
    name: brukina-marketplace
    runtime: node
    plan: free
    # FIXED: Chained the required validation sweeps prior to building dist directories to prevent dirty deployments
    buildCommand: npm ci && npm run check && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      
      # Frontend Client Access Keys (Exposed to Vite bundle)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      # Server-Side Administrative Keys (Gated safely away from browser scripts)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TELEPHONY_PROVIDER_API_KEY
        sync: false
      - key: TELEPHONY_PROVIDER_VOICE_URL
        value: "https://arkesel.com"
      - key: WEBHOOK_SECRET
        sync: false
